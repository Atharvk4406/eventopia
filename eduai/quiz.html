<div class="page-container">
  <div class="page-header">
    <h1><i class="fa-solid fa-circle-question" style="color:var(--purple)"></i> AI Quiz Generator</h1>
    <p>Gemini AI creates custom multiple-choice questions on any topic · Test your knowledge instantly</p>
  </div>

  <div class="quiz-container">
    <!-- SETUP -->
    <div class="quiz-setup" id="quizSetup">
      <div style="margin-bottom:20px">
        <label>Topic or Subject</label>
        <input class="input-field" id="quizTopic" placeholder="e.g. Photosynthesis, Quadratic Equations, World War II..." style="margin-top:8px">
      </div>
      <div style="margin-bottom:24px">
        <label>Difficulty Level</label>
        <div class="difficulty-row">
          <button class="diff-btn selected" onclick="selectDiff(this,'Easy')">🟢 Easy</button>
          <button class="diff-btn" onclick="selectDiff(this,'Medium')">🟡 Medium</button>
          <button class="diff-btn" onclick="selectDiff(this,'Hard')">🔴 Hard</button>
        </div>
      </div>
      <button class="btn btn-purple" onclick="generateQuiz()" id="genBtn" style="width:100%;justify-content:center">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Quiz with AI
      </button>
      <p id="genStatus" style="text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px"></p>
    </div>

    <!-- QUESTIONS -->
    <div id="quizQuestions" style="display:none"></div>

    <!-- SCORE -->
    <div class="score-card" id="scoreCard" style="display:none">
      <div class="score-circle"><span id="scoreText">0/5</span></div>
      <h2 id="scoreMsgTitle" style="font-size:1.5rem;font-weight:800;margin-bottom:8px"></h2>
      <p id="scoreMsg" style="color:var(--muted);margin-bottom:28px"></p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="retakeQuiz()"><i class="fa-solid fa-rotate"></i> Retake Quiz</button>
        <button class="btn btn-outline" onclick="newQuiz()"><i class="fa-solid fa-plus"></i> New Topic</button>
        <a href="tutor.html" class="btn btn-outline"><i class="fa-solid fa-robot"></i> Study with AI Tutor</a>
      </div>
    </div>
  </div>

<script src="app.js"></script>
<script>
let difficulty = 'Easy';
let questions = [];
let answers = [];
let score = 0;

function selectDiff(btn, d) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  difficulty = d;
}

async function generateQuiz() {
  const topic = document.getElementById('quizTopic').value.trim();
  if (!topic) { showToast('Please enter a topic first!'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('genStatus').textContent = '⏳ Generating your quiz with Gemini AI...';

  const prompt = `Create exactly 5 multiple-choice quiz questions about "${topic}" at ${difficulty} difficulty level for a student.

Return ONLY a valid JSON array in this exact format with no other text:
[
  {
    "question": "Question text here?",
    "options": ["Option A", "Option B", "Option C", "Option D"],
    "correct": 0
  }
]

Rules:
- "correct" is the 0-based index of the correct answer in options array
- Make questions educational and clear
- Make wrong options plausible but clearly incorrect
- Return ONLY the JSON array, nothing else`;

  try {
    const raw = await askGemini(prompt);
    // Extract JSON from response
    const match = raw.match(/\[[\s\S]*\]/);
    if (!match) throw new Error('No JSON found');
    questions = JSON.parse(match[0]);
    if (!Array.isArray(questions) || questions.length === 0) throw new Error('Invalid format');

    answers = new Array(questions.length).fill(null);
    score = 0;
    renderQuestions();
    document.getElementById('genStatus').textContent = '';
    btn.disabled = false;
  } catch (e) {
    console.warn("Gemini API Quiz Generation failed, using offline generator:", e);
    showToast('Offline Mode: Generated quiz locally');
    questions = getFallbackQuiz(topic, difficulty);
    answers = new Array(questions.length).fill(null);
    score = 0;
    renderQuestions();
    document.getElementById('genStatus').textContent = '';
    btn.disabled = false;
  }
}

function renderQuestions() {
  document.getElementById('quizSetup').style.display = 'none';
  document.getElementById('scoreCard').style.display = 'none';
  const container = document.getElementById('quizQuestions');
  container.style.display = 'block';
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${qi}`;
    const opts = q.options.map((opt, oi) =>
      `<button class="option-btn" id="opt_${qi}_${oi}" onclick="selectAnswer(${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`
    ).join('');
    card.innerHTML = `
      <div class="question-num">Question ${qi+1} of ${questions.length} · <span class="tag tag-purple">${difficulty}</span></div>
      <div class="question-text">${q.question}</div>
      ${opts}`;
    container.appendChild(card);
  });

  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn btn-purple';
  submitBtn.id = 'submitBtn';
  submitBtn.style = 'width:100%;justify-content:center;margin-top:8px';
  submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Submit Answers';
  submitBtn.onclick = submitQuiz;
  container.appendChild(submitBtn);
}

function selectAnswer(qi, oi) {
  // Clear previous selection for this question
  questions[qi].options.forEach((_, i) => {
    const b = document.getElementById(`opt_${qi}_${i}`);
    b.classList.remove('correct', 'wrong');
    b.style.borderColor = '';
    b.style.background = '';
  });
  answers[qi] = oi;
  document.getElementById(`opt_${qi}_${oi}`).style.borderColor = 'var(--blue)';
  document.getElementById(`opt_${qi}_${oi}`).style.background = 'rgba(59,130,246,.15)';
}

function submitQuiz() {
  if (answers.some(a => a === null)) { showToast('Please answer all questions!'); return; }

  score = 0;
  questions.forEach((q, qi) => {
    const correct = q.correct;
    const chosen  = answers[qi];
    questions[qi].options.forEach((_, oi) => {
      const b = document.getElementById(`opt_${qi}_${oi}`);
      b.disabled = true;
      b.style.borderColor = '';
      b.style.background = '';
      b.classList.remove('correct','wrong');
      if (oi === correct) b.classList.add('correct');
      else if (oi === chosen && oi !== correct) b.classList.add('wrong');
    });
    if (chosen === correct) score++;
  });

  document.getElementById('submitBtn').remove();

  setTimeout(() => {
    document.getElementById('quizQuestions').style.display = 'none';
    showScore();
  }, 1800);
}

function showScore() {
  document.getElementById('scoreCard').style.display = 'block';
  document.getElementById('scoreText').textContent = `${score}/5`;
  const pct = score / 5;
  let title, msg;
  if (pct === 1)       { title = '🏆 Perfect Score!';      msg = 'Outstanding! You mastered this topic completely.'; }
  else if (pct >= 0.8) { title = '⭐ Excellent!';           msg = 'Great job! You have a solid understanding of the topic.'; }
  else if (pct >= 0.6) { title = '👍 Good Effort!';        msg = 'Not bad! Review the missed questions with the AI Tutor.'; }
  else if (pct >= 0.4) { title = '📖 Keep Studying!';      msg = 'A bit more practice needed. Use the AI Tutor to review.'; }
  else                 { title = '💪 Don\'t Give Up!';      msg = 'Start with the AI Tutor to build your foundation first.'; }

  document.getElementById('scoreMsgTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
  bumpStat('quizzes');
  showToast('Quiz completed! Score: ' + score + '/5');
}

function retakeQuiz() {
  answers = new Array(questions.length).fill(null);
  score   = 0;
  renderQuestions();
  document.getElementById('scoreCard').style.display = 'none';
}

function newQuiz() {
  questions = []; answers = []; score = 0;
  document.getElementById('quizSetup').style.display = 'block';
  document.getElementById('quizQuestions').style.display = 'none';
  document.getElementById('scoreCard').style.display = 'none';
  document.getElementById('genBtn').disabled = false;
  document.getElementById('genStatus').textContent = '';
}

function getFallbackQuiz(topic, difficulty) {
  const cleanTopic = topic.toLowerCase().trim();
  
  // Try to find a prebaked match
  let key = Object.keys(PREBAKED_QUIZZES).find(k => cleanTopic.includes(k) || k.includes(cleanTopic));
  if (key && PREBAKED_QUIZZES[key]) {
    // Return a copy of the prebaked quiz
    return JSON.parse(JSON.stringify(PREBAKED_QUIZZES[key]));
  }
  
  // Dynamic template quiz generator
  return [
    {
      question: `Which of the following best defines the primary concept of "${topic}"?`,
      options: [
        `A fundamental principle or subject of study representing key analytical patterns.`,
        `A temporary phenomenon that has no scientific or practical relevance.`,
        `An obsolete theory that was disproven in early twentieth-century research.`,
        `A recreational term used exclusively in literature and media.`
      ],
      correct: 0
    },
    {

        `It allows learners to build a systematic understanding of its key variables.`,
        `It is purely used to fill school schedules and exams.`,
        `It helps restrict the circulation of knowledge to professionals.`
      ],
      correct: 1
    },
    {
      question: `Which of the following is a major component or sub-topic related to "${topic}"?`,
      options: [
        `A set of core frameworks that define its rules, variables, and applications.`,
        `An entirely unrelated set of arbitrary facts.`,
        `A collection of fictional essays written by early novelists.`,
        `A list of random numbers with no logical sequence.`
      ],
      correct: 0
    },
    {
      question: `What is a common challenge students face when first learning about "${topic}"?`,
      options: [
        `Textbooks on this topic are strictly prohibited worldwide.`,
        `The concepts violate basic human reasoning and laws of science.`,
        `Synthesizing abstract theories and applying them to practical exercises.`,

}
